name: Auto Parse Proxies

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Явно даем права на запись для токена
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parser
        run: python parser.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add proxyes.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update proxies list" && git push)
